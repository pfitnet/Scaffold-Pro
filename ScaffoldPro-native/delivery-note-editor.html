<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Delivery Note · ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/delivery-note-editor.css" />
</head>
<body data-page="project-detail">
  <nav id="sidebar"></nav>
  <main id="content">
    <div id="dn-header"></div>

    <div id="not-found" class="empty-state hidden">
      <h2>Delivery note not found</h2>
    </div>

    <div id="dn-body" class="hidden">
      <div class="toolbar" style="justify-content: space-between;">
        <div style="display:flex; gap:8px; align-items:center;">
          <label style="font-size:12px; color:var(--text-secondary);">Status</label>
          <select id="status-select">
            <option value="Draft">Draft</option>
            <option value="Issued">Issued</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <div class="tb-pick"><label class="tb-ico" for="language-select" title="Item names in, English or Chinese"><i data-icon="globe" data-size="18"></i><span class="sr-only">Items in</span></label>
            <select id="language-select" title="The language the item names are printed in on the PDF and Word copy"></select></div>
          <button type="button" class="export-menu" id="export-btn" data-no-icon>Export</button>
          <button id="export-pdf-btn" class="hidden" tabindex="-1">Export PDF</button>
          <button id="export-word-btn" class="hidden" tabindex="-1">Export Word</button>
          <button id="print-btn">Print…</button>
          <button id="locate-file-btn" title="Show this document’s PDF or Word file in Finder">Locate File</button>
          <button id="delete-doc-btn" class="danger-btn">Delete…</button>
        </div>
        <a id="back-link" class="hidden" href="#" aria-hidden="true"></a>
      </div>

      <div class="signed-bar hidden" id="dn-signed-bar"></div>

      <div class="quotation-import" id="quotation-import">
        <label for="quotation-import-select">Import from Quotation</label>
        <select id="quotation-import-select"></select>
        <button id="import-quotation-btn">Import Items</button>
        <span class="quotation-import-note" id="quotation-import-note"></span>
      </div>

      <div class="header-fields">
        <div class="field"><label>Delivery Date</label><input type="date" id="doc-date-input" /></div>
        <div class="field"><label>Delivery Address</label><input type="text" id="delivery-address-input" /></div>
        <div class="field"><label>Contact Person</label><input type="text" id="contact-person-input" placeholder="e.g. Nick Li / Lok Lok" /></div>
        <div class="field"><label>Delivered By</label><input type="text" id="delivered-by-input" /></div>
        <div class="field"><label>Received By</label><input type="text" id="received-by-input" /></div>
      </div>

      <div class="boq-grid">
        <div>
          <!-- The price list and category are in the ☰ list at the right (js/hover-menu.js) -->
          <div class="am-head">
            <h2>Add Materials</h2>
            <input type="text" id="search-box" placeholder="Search items" />
            <div class="tb-pick am-filter">
              <button type="button" class="tb-ico group-menu" id="materials-menu-btn" data-no-icon data-selects="source-select:Price list,category-select:Category" aria-label="Price list and category"><i data-icon="list" data-size="18"></i><span class="am-dot" aria-hidden="true"></span></button>
              <select id="source-select">
              <option value="SP">SP Material &amp; Price List 2026</option>
              <option value="SCAFOM">SCAFOM Material &amp; Price List</option>
            </select>
              <select id="category-select"><option value="">All Categories</option></select>
            </div>
          </div>
          <div class="picker-results" id="picker-results"></div>
        </div>

        <div>
          <div class="lines-head">
            <h2>Items Delivered</h2>
            <!-- Multiply is in the ☰ list (js/hover-menu.js, .lines-menu); the real button stays here, hidden. -->
            <span class="hidden">
              <button type="button" class="multiply-btn hidden" id="multiply-btn" data-no-icon title="Multiply the quantities, e.g. ×2 for 2 sets of the same scaffold">× Multiply…</button>
            </span>
            <span class="ml-menu"><button type="button" class="tb-ico lines-menu" id="lines-menu-btn" data-no-icon data-multiply="multiply-btn" aria-label="Multiply quantities"><i data-icon="list" data-size="18"></i></button></span>
          </div>
          <div id="line-items"></div>
          <details class="custom-item" id="custom-item-box">
            <summary>+ Add a custom item (not on a price list)</summary>
            <div class="custom-item-row">
              <div class="ci-desc-wrap"><textarea id="ci-description" rows="1" placeholder="Description, e.g. Transport to site  (Shift-Return for a new line)" title="Return adds the item · Shift-Return starts a new line in it"></textarea></div>
              <input type="text" id="ci-unit" value="lot" title="Unit" />
              <input type="number" id="ci-qty" min="1" step="1" value="1" title="Quantity" />
              
              <button id="ci-add-btn">Add</button>
            </div>
          </details>

          <div style="margin-top: 20px;">
            <label style="font-size:12px; color:var(--text-secondary);">Notes</label>
            <textarea id="notes-box" rows="3"></textarea>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/doc-authors.js"></script>
  <script src="js/calc-input.js"></script>
  <script src="js/qty-tab.js"></script>
  <script src="js/keep-focus.js"></script>
  <script src="js/drag-reorder.js"></script>
  <script src="js/item-picker.js"></script>
  <script src="js/paragraph-format.js"></script>
  <script src="js/custom-item.js"></script>
  <script src="js/doc-language.js"></script>
  <script src="js/document-actions.js"></script>
  <script src="js/docx-export.js"></script>
  <script src="js/doc-preview.js"></script>
  <script src="js/multiply.js"></script>
  <script src="js/signed-copy.js"></script>
  <script src="js/dn-signed.js"></script>
  <script src="js/delivery-note-editor.js"></script>
</body>
</html>
