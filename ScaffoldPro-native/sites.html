<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sites · ScaffoldPro</title>
  <!-- Sites are on the Clients & Sites page now; old links still land there. -->
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      let to = 'clients.html';
      if (q.get('id')) to += `?site=${encodeURIComponent(q.get('id'))}`;
      else if (q.get('new') === '1') to += '?newSite=1';
      location.replace(to);
    })();
  </script>
</head>
<body></body>
</html>
