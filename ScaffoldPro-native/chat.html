<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Chat — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body data-page="chat" class="chat-body">
  <nav id="sidebar"></nav>
  <main id="content" class="chat-content">
    <div class="chat-shell">
      <aside class="chat-list">
        <div class="chat-list-head">
          <h1>Chat</h1>
          <input type="search" id="chat-search" placeholder="Search people" autocomplete="off" />
        </div>
        <div class="chat-convs" id="chat-convs"></div>
      </aside>

      <section class="chat-main">
        <header class="chat-head" id="chat-head"></header>
        <div class="chat-scroll" id="chat-scroll">
          <div class="chat-messages" id="chat-messages"></div>
        </div>
        <button class="chat-new-pill hidden" id="chat-new-pill" data-no-icon>New messages ↓</button>
        <div class="chat-typing hidden" id="chat-typing"><span class="dots"><i></i><i></i><i></i></span><span id="chat-typing-text"></span></div>
        <div class="chat-reply hidden" id="chat-reply"></div>
        <div class="chat-composer">
          <button class="chat-tool" id="chat-emoji-btn" data-no-icon title="Emoji" aria-label="Emoji">
            <svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M6.8 11.8c.8 1.3 1.9 2 3.2 2s2.4-.7 3.2-2"/><circle cx="7.4" cy="8" r=".9" fill="currentColor"/><circle cx="12.6" cy="8" r=".9" fill="currentColor"/></svg>
          </button>
          <button class="chat-tool gif" id="chat-gif-btn" data-no-icon title="GIF" aria-label="GIF">GIF</button>
          <button class="chat-tool" id="chat-attach-btn" data-no-icon title="Send a picture or GIF from this Mac" aria-label="Attach">
            <svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.5" cy="8.5" r="1.4"/><path d="m3.5 14 4-4 3 3 2-2 4 3.5"/></svg>
          </button>
          <textarea id="chat-input" rows="1" placeholder="Message" autocomplete="off"></textarea>
          <button class="chat-send" id="chat-send" data-no-icon title="Send (Return)" aria-label="Send">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3.4 16.6 17 10 3.4 3.4l1.8 5.4L12 10l-6.8 1.2z"/></svg>
          </button>
        </div>
        <div class="chat-pop hidden" id="emoji-pop"></div>
        <div class="chat-pop gif-pop hidden" id="gif-pop"></div>
      </section>
    </div>
  </main>

  <script src="js/dialogs.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
