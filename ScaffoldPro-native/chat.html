<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Team · ScaffoldPro</title>
  <!-- Chat is on the Team page now (its first tab); old links still land there. -->
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      let to = 'team.html?tab=chat';
      if (q.get('with')) to += `&with=${encodeURIComponent(q.get('with'))}`;
      location.replace(to);
    })();
  </script>
</head>
<body></body>
</html>
