<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin · ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="admin">
  <nav id="sidebar"></nav>
  <main id="content">
    <header class="page-header" id="admin-head">
      <div>
        <h1>Admin</h1>
        <div class="subtitle"><span id="admin-fact">Company paperwork and the payroll</span>
          <span class="info-tip" tabindex="0" title="Company paperwork with its expiry reminders, and the employees on the payroll. Site workers have their own page (Workers); company details and currency are in Settings." aria-label="About this page"></span></div>
      </div>
    </header>

    <div class="tabs" id="admin-tabs">
      <button data-tab="workers" class="active">Company Documents</button>
      <button data-tab="employees">Employees</button>
    </div>

    <div id="admin-tab-workers">
    <!-- Expiry reminders (sections 42-43) -->
    <section class="admin-section">
      <div class="section-toolbar"><h2>Needs Attention</h2></div>
      <div id="expiring-list"></div>
    </section>

    <!-- Company / administrative documents (section 43) -->
    <section class="admin-section">
      <div class="section-toolbar">
        <h2>Company Documents</h2>
      </div>
      <!-- Upload… (the header's primary) asks these in a small sheet first. -->
      <span class="hidden">
        <select id="admin-doc-category" data-native></select>
        <input type="date" id="admin-doc-expiry" />
        <button id="upload-admin-doc-btn">Upload Documents…</button>
      </span>
      <div class="toolbar"><input type="text" id="admin-doc-search" placeholder="Search company documents" /></div>
      <div id="admin-doc-list"></div>
    </section>
    </div>

    <!-- Employees: pay, full-time / part-time, MPF -->
    <div id="admin-tab-employees" class="hidden">
      <div class="stat-grid" id="employee-stats"></div>
      <div class="toolbar">
        <input type="text" id="employee-search" placeholder="Search employees" />
        <label class="check-chip"><input type="checkbox" id="show-former-employees" />Former</label>
        <!-- The header's primary and ··· press these. -->
        <span class="hidden">
          <button id="export-employees-btn">Export to Excel</button>
          <button id="record-pay-btn">Record Pay…</button>
          <button id="new-employee-btn">New Employee</button>
        </span>
      </div>
      <div id="employee-list"></div>
    </div>
  </main>

  <div class="modal-backdrop hidden" id="employee-modal">
    <div class="modal wide" role="dialog" aria-labelledby="em-title">
      <h2 id="em-title">New Employee</h2>
      <div class="form-grid">
        <div class="field"><label for="em-name">Name</label><input type="text" id="em-name" /></div>
        <div class="field"><label for="em-chineseName">Chinese name</label><input type="text" id="em-chineseName" /></div>
        <div class="field"><label for="em-position">Position</label><input type="text" id="em-position" placeholder="e.g. Scaffolder, Foreman, Clerk" /></div>
        <div class="field"><label for="em-phone">Phone</label><input type="text" id="em-phone" /></div>
        <div class="field"><label for="em-type">Employment</label>
          <select id="em-type"><option>Full-time</option><option>Part-time</option></select></div>
        <div class="field"><label for="em-worker">Same person as worker (optional)</label><select id="em-worker"></select></div>
        <div class="field"><label for="em-basis">Paid</label>
          <select id="em-basis"><option value="Monthly">Monthly salary</option><option value="Daily">By the day</option><option value="Hourly">By the hour</option></select></div>
        <div class="field"><label for="em-rate" id="em-rate-label">Monthly salary</label><input type="number" id="em-rate" min="0" step="0.01" /></div>
        <div class="field" id="em-units-field"><label for="em-units" id="em-units-label">Usual days a month</label><input type="number" id="em-units" min="0" step="0.5" /></div>
        <div class="field"><label for="em-allowance">Monthly allowances (optional)</label><input type="number" id="em-allowance" min="0" step="0.01" placeholder="travel, meals, phone…" /></div>
        <div class="field"><label for="em-leave">Annual leave (days a year)</label><input type="number" id="em-leave" min="0" step="0.5" /></div>
        <div class="field"><label for="em-bank">Bank account (for paying)</label><input type="text" id="em-bank" /></div>
        <div class="field"><label for="em-start">Started</label><input type="date" id="em-start" /></div>
        <div class="field"><label for="em-end">Left (optional)</label><input type="date" id="em-end" /></div>
        <div class="field span-2"><label class="small-note"><input type="checkbox" id="em-mpf" checked /> Employer MPF (5% of pay, up to HK$1,500 a month)</label></div>
        <div class="field span-2"><label for="em-notes">Notes</label><input type="text" id="em-notes" /></div>
        <div class="field span-2 hidden" id="em-archived-field"><label class="small-note"><input type="checkbox" id="em-archived" /> Former employee (off the payroll; kept for the records)</label></div>
      </div>
      <div class="emp-estimate" id="em-estimate"></div>
      <div class="error-text hidden" id="em-error"></div>
      <div class="actions">
        <button id="em-delete" class="left hidden">Delete</button>
        <button id="em-cancel">Cancel</button>
        <button class="primary" id="em-save">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="payroll-modal">
    <div class="modal payroll" role="dialog" aria-labelledby="pr-title">
      <h2 id="pr-title">Record Pay</h2>
      <p class="small-note">Each ticked employee's pay plus the employer's MPF goes into Accounting › Expenses under “Salaries &amp; MPF”. A month already recorded for someone is skipped.</p>
      <div class="payroll-head">
        <div class="field"><label for="pr-month">Month</label><input type="month" id="pr-month" /></div>
        <div class="field"><label for="pr-date">Paid on</label><input type="date" id="pr-date" /></div>
      </div>
      <div class="payroll-scroll"><table class="money" id="payroll-table"></table></div>
      <div class="error-text hidden" id="pr-error"></div>
      <div class="actions">
        <button id="pr-cancel">Cancel</button>
        <button class="primary" id="pr-save">Record in Expenses</button>
      </div>
    </div>
  </div>

  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
