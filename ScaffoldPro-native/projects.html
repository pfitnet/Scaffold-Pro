<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Projects — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="projects">
  <nav id="sidebar"></nav>
  <main id="content">
    <!-- Projects: a card for each (or a list), filtered by status, sorted,
         searched (js/projects.js) -->
    <header class="pj-hero">
      <div>
        <h1>Projects <span class="pj-total" id="pj-total"></span></h1>
        <div class="subtitle">Every project is the home for its BOQs, quotations, invoices, and documents</div>
      </div>
      <button class="primary pj-new" id="new-project-btn"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>New Project</span></button>
    </header>

    <div class="pj-bar">
      <label class="pj-search">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
        <input type="text" id="search-box" placeholder="Search number, name, client or site" autocomplete="off" />
        <kbd title="Press / to search">/</kbd>
      </label>
      <div class="pj-filters" id="pj-filters" role="tablist" aria-label="Status"></div>
      <div class="pj-tools">
        <select id="pj-sort" title="Order">
          <option value="number">Newest number</option>
          <option value="activity">Recently worked on</option>
          <option value="name">Name A–Z</option>
          <option value="client">Client</option>
        </select>
        <div class="pj-view" role="group" aria-label="View">
          <button type="button" data-view="cards" data-no-icon title="Cards" aria-label="Cards"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg></button>
          <button type="button" data-view="list" data-no-icon title="List" aria-label="List"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8"/><circle cx="2.6" cy="4" r=".6" fill="currentColor"/><circle cx="2.6" cy="8" r=".6" fill="currentColor"/><circle cx="2.6" cy="12" r=".6" fill="currentColor"/></svg></button>
          <button type="button" data-view="overview" data-no-icon title="Overview — each project's documents and how they're linked" aria-label="Overview"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="1.5" y="2.5" width="3.5" height="3" rx=".8"/><rect x="1.5" y="10.5" width="3.5" height="3" rx=".8"/><rect x="11" y="6.5" width="3.5" height="3" rx=".8"/><path d="M5 4c3 0 3 4 6 4M5 12c3 0 3-4 6-4"/></svg></button>
        </div>
      </div>
    </div>

    <div id="list-container"></div>
  </main>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal wide">
      <h2>New Project</h2>

      <div class="field">
        <label>Project Number</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <span id="proposed-number" style="font-family: monospace; font-weight:600;"></span>
          <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-secondary);">
            <input type="checkbox" id="f-override" /> Override
          </label>
          <input type="text" id="f-manualNumber" placeholder="YYNNN" class="hidden" style="width:80px;" />
        </div>
      </div>

      <div class="field job-field"><label id="f-job-label">Is this a scaffolding job or a crane job?</label>
        <div class="job-switch" role="radiogroup" aria-labelledby="f-job-label">
          <input type="radio" name="f-jobType" id="f-job-scaffolding" value="Scaffolding" checked /><label for="f-job-scaffolding"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 2.5v15M15 2.5v15M5 6.5h10M5 11h10M5 15.5h10M5 6.5l10 4.5"/></svg>Scaffolding</label>
          <input type="radio" name="f-jobType" id="f-job-crane" value="Crane" /><label for="f-job-crane"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17.5V3.5M2.5 17.5h6M5 3.5h12.5M5 6.5l3-3M15 3.5v5"/><path d="M13.5 8.5h3l-.5 2h-2z"/></svg>Crane</label>
          <span class="job-thumb" aria-hidden="true"></span>
        </div>
      </div>
      <div class="field"><label>Project Name</label><input type="text" id="f-name" /></div>
      <div class="form-grid">
        <div class="field"><label>Client</label><select id="f-client"></select></div>
        <div class="field"><label>Site</label><select id="f-site"></select></div>
      </div>

      <details class="optional-details">
        <summary>Optional details</summary>
        <div class="form-grid">
          <div class="field"><label>Start Date</label><input type="date" id="f-startDate" /></div>
          <div class="field"><label>Expected Completion</label><input type="date" id="f-expectedCompletionDate" /></div>
          <div class="field span-2"><label>Project Manager</label><input type="text" id="f-projectManager" /></div>
          <div class="field span-2"><label>Description</label><textarea id="f-projectDescription" rows="2"></textarea></div>
          <div class="field span-2"><label>Internal Notes</label><textarea id="f-internalNotes" rows="2"></textarea></div>
        </div>
      </details>

      <label class="small-note" style="display:flex; gap:6px; align-items:center; margin-top:10px;">
        <input type="checkbox" id="f-uploadDrawing" /> Upload a drawing after creating the project
      </label>

      <div class="error-text hidden" id="form-error"></div>
      <div class="actions">
        <button id="cancel-btn">Cancel</button>
        <button class="primary" id="save-btn">Create Project</button>
      </div>
    </div>
  </div>

  <script src="js/dialogs.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/project-delete.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
