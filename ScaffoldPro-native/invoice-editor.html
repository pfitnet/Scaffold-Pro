<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Invoice — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .boq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .qty-input { width: 60px; padding: 3px 6px; }
    .price-input { width: 80px; padding: 3px 6px; }
    .totals-box { margin-top: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .totals-box .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
    .totals-box .row.grand { font-size: 18px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }
    .totals-box .row.balance { font-weight: 600; color: var(--danger); }
    .header-fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 14px; margin-bottom: 16px; padding: 14px 16px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .header-fields .field.rental-field { grid-column: span 2; }
    @media (max-width: 1100px) { .header-fields { grid-template-columns: 1fr 1fr; } }
    .header-fields .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .header-fields .field input:not([type="checkbox"]), .header-fields .field select { width: 100%; }
    .header-fields .field.full { grid-column: 1 / -1; }
    .payment-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .payment-row input { width: 100px; }
      .source-note { font-size: 12px; color: var(--text-secondary); }
    .source-note a { color: var(--accent); }
    .line-discount-note { display: block; font-size: 11px; color: var(--text-secondary); }
  </style>
</head>
<body data-page="project-detail">
  <nav id="sidebar"></nav>
  <main id="content">
    <div id="invoice-header"></div>

    <div id="not-found" class="empty-state hidden">
      <h2>Invoice not found</h2>
    </div>

    <div id="invoice-body" class="hidden">
      <div class="toolbar" style="justify-content: space-between;">
        <div style="display:flex; gap:8px; align-items:center;">
          <label style="font-size:12px; color:var(--text-secondary);">Status</label>
          <select id="status-select">
            <option value="Draft">Draft</option>
            <option value="Issued">Issued</option>
            <option value="PartiallyPaid">Partially Paid</option>
            <option value="Paid">Paid</option>
            <option value="Overdue">Overdue</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <button type="button" class="export-menu" id="export-btn" data-no-icon>Export</button>
          <button id="export-pdf-btn" class="hidden" tabindex="-1">Export PDF</button>
          <button id="export-word-btn" class="hidden" tabindex="-1">Export Word</button>
          <button id="print-btn">Print…</button>
          <button id="locate-file-btn" title="Show this document’s PDF or Word file in Finder">Locate File</button>
          <button id="delete-doc-btn" class="danger-btn">Delete…</button>
        </div>
        <a id="back-link" class="hidden" href="#" aria-hidden="true"></a>
      </div>

      <div class="dn-signed-list hidden" id="inv-signed-notes"></div>

      <div class="header-fields">
        <div class="field full source-note" id="source-note"></div>
        <div class="field rental-field"><label>Months charged</label><input type="number" id="rental-months-input" min="1" step="1" /></div>
        <div class="field rental-field"><label>Rental period (optional)</label><input type="text" id="rental-period-input" placeholder="e.g. 1 Oct – 31 Oct 2026" /></div>
        <div class="field"><label>Invoice Date</label><input type="date" id="doc-date-input" /></div>
        <div class="field"><label>Due Date</label><input type="date" id="due-date-input" /></div>
        <div class="field"><label>Discount Type</label>
          <select id="discount-type-select">
            <option value="None">None</option>
            <option value="Percent">Percent</option>
            <option value="Fixed">Fixed Amount</option>
          </select>
        </div>
        <div class="field"><label>Discount Value</label><input type="number" id="discount-value-input" min="0" step="0.01" /></div>
        <!-- No sales tax in Hong Kong: shown only on an older document that still has a tax rate, so it can be set to 0. -->
        <div class="field hidden" id="tax-rate-field"><label>Tax Rate (%) — set to 0</label><input type="number" id="tax-rate-input" min="0" step="0.01" /></div>
        <div class="field full"><label for="payment-terms-input">Terms (payment and bank details) <span class="terms-source" id="terms-source"></span></label>
          <textarea id="payment-terms-input" rows="7" placeholder="e.g. Within 30 days of the invoice date"></textarea>
        </div>
      </div>

      <div class="boq-grid">
        <div>
          <!-- The price list and category are in the ☰ list at the right (js/hover-menu.js) -->
          <div class="am-head">
            <h2>Add Materials</h2>
            <input type="text" id="search-box" placeholder="Search items" />
            <div class="tb-pick am-filter">
              <button type="button" class="tb-ico group-menu" id="materials-menu-btn" data-no-icon data-selects="source-select:Price list,category-select:Category" aria-label="Price list and category"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg><span class="am-dot" aria-hidden="true"></span></button>
              <select id="source-select">
              <option value="SP">SP Material &amp; Price List 2026</option>
              <option value="SCAFOM">SCAFOM Material &amp; Price List</option>
            </select>
              <select id="category-select"><option value="">All Categories</option></select>
            </div>
          </div>
          <div class="picker-results" id="picker-results"></div>
        </div>

        <div>
          <div class="lines-head">
            <h2>Line Items</h2>
            <!-- Multiply is in the ☰ list (js/hover-menu.js, .lines-menu); the real button stays here, hidden. -->
            <span class="hidden">
              <button type="button" class="multiply-btn hidden" id="multiply-btn" data-no-icon title="Multiply the quantities — e.g. ×2 for 2 sets of the same scaffold">× Multiply…</button>
            </span>
            <span class="ml-menu"><button type="button" class="tb-ico lines-menu" id="lines-menu-btn" data-no-icon data-multiply="multiply-btn" aria-label="Multiply quantities"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg></button></span>
          </div>
          <div id="line-items"></div>
          <details class="custom-item" id="custom-item-box">
            <summary>+ Add a custom item (not on a price list)</summary>
            <div class="custom-item-row">
              <div class="ci-desc-wrap"><textarea id="ci-description" rows="1" placeholder="Description, e.g. Transport to site  (Shift-Return for a new line)" title="Return adds the item · Shift-Return starts a new line in it"></textarea></div>
              <input type="text" id="ci-unit" value="lot" title="Unit" />
              <input type="number" id="ci-qty" min="1" step="1" value="1" title="Quantity" />
              <input type="number" id="ci-extra" min="0" step="0.01" placeholder="Unit price" />
              <button id="ci-add-btn">Add</button>
            </div>
          </details>

          <div class="totals-box" id="totals-box"></div>

          <div class="payment-row hidden" id="payment-row">
            <label style="font-size:12px; color:var(--text-secondary);">Record payment</label>
            <input type="number" id="payment-amount-input" min="0" step="0.01" placeholder="Amount" />
            <input type="date" id="payment-date-input" title="Date received" />
            <select id="payment-method-select" title="How it was paid">
              <option value="">Method…</option><option>Bank transfer</option><option>Cheque</option><option>FPS</option><option>Cash</option><option>Other</option>
            </select>
            <input type="text" id="payment-ref-input" placeholder="Ref. (cheque no.)" style="width:120px" />
            <button id="record-payment-btn">Add Payment</button>
          </div>

          <div style="margin-top: 20px;">
            <label style="font-size:12px; color:var(--text-secondary);">Notes</label>
            <textarea id="notes-box" rows="3"></textarea>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/dialogs.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/doc-authors.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/calc-input.js"></script>
  <script src="js/qty-tab.js"></script>
  <script src="js/keep-focus.js"></script>
  <script src="js/drag-reorder.js"></script>
  <script src="js/item-picker.js"></script>
  <script src="js/document-actions.js"></script>
  <script src="js/line-discount.js"></script>
  <script src="js/multiply.js"></script>
  <script src="js/terms-table.js"></script>
  <script src="js/paragraph-format.js"></script>
  <script src="js/custom-item.js"></script>
  <script src="js/docx-export.js"></script>
  <script src="js/doc-preview.js"></script>
  <script src="js/signed-copy.js"></script>
  <script src="js/dn-signed.js"></script>
  <script src="js/invoice-editor.js"></script>
</body>
</html>
