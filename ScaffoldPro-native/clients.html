<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Clients — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="clients">
  <nav id="sidebar"></nav>
  <main id="content">
    <h1>Clients</h1>
    <div class="subtitle">Companies you work for</div>

    <div class="toolbar">
      <input type="text" id="search-box" placeholder="Search clients" />
      <label class="small-note"><input type="checkbox" id="show-archived" /> Show archived</label>
      <span class="toolbar-spacer"></span>
      <button id="import-xlsx-btn" data-no-icon title="Add or update clients from an Excel (.xlsx) or CSV file">Import from Excel…</button>
      <button id="export-xlsx-btn" data-no-icon title="Save the clients as an Excel file (.xlsx) — edit it and import it back">Export to Excel</button>
      <button class="primary" id="new-btn">+ New Client</button>
    </div>

    <div id="list-container"></div>
  </main>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal wide">
      <h2 id="sheet-title">New Client</h2>
      <div class="form-grid">
        <div class="field span-2"><label>Company Name</label><input type="text" id="f-companyName" /></div>
        <div class="field"><label>Client Reference</label><input type="text" id="f-clientReference" /></div>
        <div class="field"><label>Contact Person</label><input type="text" id="f-contactPerson" /></div>
        <div class="field"><label>Phone</label><input type="text" id="f-phone" /></div>
        <div class="field"><label>Email</label><input type="text" id="f-email" /></div>
        <div class="field span-2"><label>Address Line 1</label><input type="text" id="f-address" placeholder="e.g. 38th Floor, Dorset House, Taikoo Place" /></div>
        <div class="field span-2"><label>Address Line 2</label><input type="text" id="f-addressLine2" placeholder="e.g. 979 King's Road, Quarry Bay" /></div>
        <div class="field span-2"><label>Address Line 3</label><input type="text" id="f-addressLine3" /></div>
        <div class="field"><label>City</label><input type="text" id="f-city" /></div>
        <div class="field"><label>Postal Code</label><input type="text" id="f-postalCode" /></div>
        <div class="field"><label>Country</label><input type="text" id="f-country" /></div>
        <div class="field"><label>Default Markup (%) <span class="small-note">(new BOQs and quotations for this client start with it)</span></label><input type="number" id="f-defaultMarkupPercent" min="0" max="1000" step="0.5" placeholder="e.g. 15" /></div>
        <div class="field span-2"><label>Billing Information <span class="small-note">(replaces the address on quotations and invoices, if filled in)</span></label><textarea id="f-billingInfo" rows="3"></textarea></div>
        <div class="field span-2"><label>Notes</label><textarea id="f-notes" rows="2"></textarea></div>
      </div>
      <div class="error-text hidden" id="form-error"></div>
      <div class="actions">
        <button id="archive-btn" class="hidden left">Archive</button>
        <button id="cancel-btn">Cancel</button>
        <button class="primary" id="save-btn">Save</button>
      </div>
      <div id="related"></div>
    </div>
  </div>

  <script src="js/dialogs.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/party-page.js"></script>
  <script>
    initPartyPage({
      api: window.api.clients,
      kind: 'clients',
      fields: ['companyName', 'clientReference', 'contactPerson', 'phone', 'email', 'address', 'addressLine2', 'addressLine3', 'city', 'postalCode', 'country', 'defaultMarkupPercent', 'billingInfo', 'notes'],
      newTitle: 'New Client',
      newLabel: '+ New Client',
      titleOf: (c) => c.companyName,
      requiredMessage: 'Company name is required.',
      emptyTitle: 'No clients yet',
      emptyBody: 'Add a client before creating a project for them.',
      searchText: (c) => [c.companyName, c.clientReference, c.contactPerson, c.email, c.phone, c.city].join(' '),
      columns: [
        { title: 'Company', value: (c) => escapeHTML(c.companyName) + (c.isArchived ? ' <span class="status-pill">Archived</span>' : '') },
        { title: 'Reference', value: (c) => escapeHTML(c.clientReference || '—') },
        { title: 'Contact', value: (c) => escapeHTML(c.contactPerson || '—') },
        { title: 'Phone', value: (c) => escapeHTML(c.phone || '—') },
        { title: 'Email', value: (c) => escapeHTML(c.email || '—') },
        { title: 'Default Markup', value: (c) => (c.defaultMarkupPercent ? `${c.defaultMarkupPercent}%` : '—') },
      ],
    });
  </script>
</body>
</html>
