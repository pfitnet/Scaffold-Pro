<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Clients &amp; Sites — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="clients">
  <nav id="sidebar"></nav>
  <main id="content">
    <h1>Clients &amp; Sites</h1>
    <div class="subtitle">Who you work for, and where. A line joins a client to each site you’ve had a project at — hover or click either side to follow its lines, click a line for its projects, or drag a client’s dot onto a site to start a new project there.</div>

    <div class="toolbar">
      <input type="text" id="search-box" placeholder="Search clients and sites" />
      <label class="small-note"><input type="checkbox" id="show-archived" /> Show archived</label>
      <span class="toolbar-spacer"></span>
      <button id="import-xlsx-btn" data-no-icon title="Add or update clients or sites from an Excel (.xlsx) or CSV file">Import from Excel…</button>
      <button id="export-xlsx-btn" data-no-icon title="Save the clients or the sites as an Excel file (.xlsx)">Export to Excel…</button>
      <button id="new-site-btn" data-no-icon>+ New Site</button>
      <button class="primary" id="new-client-btn" data-no-icon>+ New Client</button>
    </div>

    <div id="list-container"></div>
    <div class="conn-board hidden" id="conn-board">
      <svg class="conn-lines" id="conn-lines" aria-hidden="true"></svg>
      <section class="conn-col" id="conn-clients" aria-label="Clients"></section>
      <div class="conn-gap"></div>
      <section class="conn-col" id="conn-sites" aria-label="Sites"></section>
    </div>
  </main>

  <!-- Client sheet -->
  <div class="modal-backdrop hidden" id="c-modal-backdrop">
    <div class="modal wide">
      <h2 id="c-sheet-title">New Client</h2>
      <div class="form-grid">
        <div class="field span-2"><label>Company Name</label><input type="text" id="c-f-companyName" /></div>
        <div class="field"><label>Client Reference</label><input type="text" id="c-f-clientReference" /></div>
        <div class="field"><label>Contact Person</label><input type="text" id="c-f-contactPerson" /></div>
        <div class="field"><label>Phone</label><input type="text" id="c-f-phone" /></div>
        <div class="field"><label>Email</label><input type="text" id="c-f-email" /></div>
        <div class="field span-2"><label>Address Line 1</label><input type="text" id="c-f-address" placeholder="e.g. 38th Floor, Dorset House, Taikoo Place" /></div>
        <div class="field span-2"><label>Address Line 2</label><input type="text" id="c-f-addressLine2" placeholder="e.g. 979 King's Road, Quarry Bay" /></div>
        <div class="field span-2"><label>Address Line 3</label><input type="text" id="c-f-addressLine3" /></div>
        <div class="field"><label>City</label><input type="text" id="c-f-city" /></div>
        <div class="field"><label>Postal Code</label><input type="text" id="c-f-postalCode" /></div>
        <div class="field"><label>Country</label><input type="text" id="c-f-country" /></div>
        <div class="field"><label>Default Markup (%) <span class="small-note">(new BOQs and quotations for this client start with it)</span></label><input type="number" id="c-f-defaultMarkupPercent" min="0" max="1000" step="0.5" placeholder="e.g. 15" /></div>
        <div class="field span-2"><label>Billing Information <span class="small-note">(replaces the address on quotations and invoices, if filled in)</span></label><textarea id="c-f-billingInfo" rows="3"></textarea></div>
        <div class="field span-2"><label>Notes</label><textarea id="c-f-notes" rows="2"></textarea></div>
      </div>
      <div class="error-text hidden" id="c-form-error"></div>
      <div class="actions">
        <button id="c-archive-btn" class="hidden left">Archive</button>
        <button id="c-cancel-btn">Cancel</button>
        <button class="primary" id="c-save-btn">Save</button>
      </div>
      <div id="c-related"></div>
    </div>
  </div>

  <!-- Site sheet -->
  <div class="modal-backdrop hidden" id="s-modal-backdrop">
    <div class="modal wide">
      <h2 id="s-sheet-title">New Site</h2>
      <div class="form-grid">
        <div class="field span-2"><label>Site Name</label><input type="text" id="s-f-name" /></div>
        <div class="field"><label>Site Reference / Code</label><input type="text" id="s-f-siteReference" /></div>
        <div class="field"><label>Contact Person</label><input type="text" id="s-f-contactPerson" /></div>
        <div class="field"><label>Phone</label><input type="text" id="s-f-phone" /></div>
        <div class="field"><label>Email</label><input type="text" id="s-f-email" /></div>
        <div class="field span-2"><label>Address</label><input type="text" id="s-f-address" /></div>
        <div class="field"><label>City</label><input type="text" id="s-f-city" /></div>
        <div class="field"><label>Postal Code</label><input type="text" id="s-f-postalCode" /></div>
        <div class="field"><label>Country</label><input type="text" id="s-f-country" /></div>
        <div class="field span-2"><label>Notes</label><textarea id="s-f-notes" rows="2"></textarea></div>
      </div>
      <div class="error-text hidden" id="s-form-error"></div>
      <div class="actions">
        <button id="s-archive-btn" class="hidden left">Archive</button>
        <button id="s-cancel-btn">Cancel</button>
        <button class="primary" id="s-save-btn">Save</button>
      </div>
      <div id="s-related"></div>
    </div>
  </div>

  <script src="js/dialogs.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/party-page.js"></script>
  <script src="js/connections.js"></script>
</body>
</html>
