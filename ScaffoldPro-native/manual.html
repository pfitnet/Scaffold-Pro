<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>User Manual · ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/manual.css" />
</head>
<body data-page="manual">
  <nav id="sidebar"></nav>
  <main id="content" class="mx">
    <!-- The User Manual: drawn from js/manual-content.js by js/manual.js. -->
    <header class="mx-cover">
      <div class="mx-cover-glow" aria-hidden="true"></div>
      <div class="mx-cover-text">
        <span class="mx-eyebrow">ScaffoldPro · User Manual</span>
        <h1>Everything you need.<br /><span>Nothing you don’t.</span></h1>
        <p>Short, visual and to the point. Hover a number on any picture to see what it means.</p>
        <label class="mx-search big"><i data-icon="search" data-size="18"></i>
          <input type="search" placeholder="What do you want to do?" autocomplete="off" aria-label="Search the manual" /></label>
      </div>
      <nav class="mx-parts" id="mx-parts" aria-label="Parts"></nav>
    </header>

    <div class="mx-wrap">
      <aside class="mx-rail" id="mx-rail" aria-label="Contents">
        <label class="mx-search"><i data-icon="search" data-size="15"></i>
          <input type="search" placeholder="Search  ( / )" autocomplete="off" aria-label="Search the manual" /></label>
        <ol id="mx-rail-list"></ol>
        <button type="button" class="mx-print" id="mx-print" data-no-icon>
          <i data-icon="print" data-size="15"></i>
          Print or save as PDF</button>
      </aside>
      <div class="mx-body" id="mx-body"></div>
    </div>
  </main>

  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/manual-shots.js"></script>
  <script src="js/manual-content.js"></script>
  <script src="js/manual.js"></script>
</body>
</html>
