<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Dashboard — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="dashboard">
  <nav id="sidebar"></nav>
  <main id="content">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <div class="subtitle" id="today-line"></div>
      </div>
      <div class="header-actions">
        <button id="announce-btn" data-no-icon title="Post an announcement to everyone, or to your team">Announce</button>
        <button id="customise-btn" data-no-icon title="Move, resize, hide or show the Dashboard’s panels">Customise</button>
      </div>
    </div>

    <div class="announce-bar hidden" id="announce-bar" aria-live="polite"></div>

    <div class="backup-reminder hidden" id="backup-reminder"></div>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="dash-grid" id="dash-grid">
      <section class="panel" data-widget="quick" data-title="Quick Actions" data-span="1">
        <h3 class="panel-title">Quick Actions</h3>
        <div class="qa-grid" id="quick-actions"></div>
      </section>
      <section class="panel" data-widget="tasks" data-title="My Tasks" data-span="3">
        <h3 class="panel-title">My Tasks <a href="tasks.html" class="panel-link">All tasks</a></h3>
        <div id="my-tasks-list"></div>
      </section>
      <section data-widget="inspections" data-title="Scaffold Inspections Due" class="panel hidden" id="inspections-panel">
        <h3 class="panel-title">Scaffold Inspections Due</h3>
        <div id="inspections-due-list"></div>
      </section>
      <section class="panel" data-widget="projects" data-title="My Active &amp; Recent Projects" data-span="3">
        <h3 class="panel-title">My Active &amp; Recent Projects</h3>
        <div id="recent-projects"></div>
      </section>
      <section class="panel" data-widget="quotations" data-title="My Quotations Awaiting Reply">
        <h3 class="panel-title" id="quotation-title">My Quotations Awaiting Reply</h3>
        <div id="quotation-list"></div>
      </section>
      <section class="panel" data-widget="unpaid" data-title="Unpaid Invoices">
        <h3 class="panel-title">Unpaid Invoices</h3>
        <div id="unpaid-list"></div>
      </section>
      <section class="panel" data-widget="documents" data-title="My Recently Changed Documents">
        <h3 class="panel-title">My Recently Changed Documents</h3>
        <div id="recent-docs"></div>
      </section>
      <section class="panel" data-widget="deliveries" data-title="My Recent Delivery Notes">
        <h3 class="panel-title">My Recent Delivery Notes</h3>
        <div id="delivery-list"></div>
      </section>
      <section class="panel" data-widget="activity" data-title="My Recent Activity">
        <h3 class="panel-title">My Recent Activity</h3>
        <div id="activity-list"></div>
      </section>
      <section class="panel" data-widget="team" data-title="Recent Team Activity">
        <h3 class="panel-title">Recent Team Activity</h3>
        <div id="team-activity-list"></div>
      </section>
      <section class="panel hidden" id="attention-block" data-widget="attention" data-title="Documents Needing Attention">
        <h3 class="panel-title">Documents Needing Attention</h3>
        <div id="attention-list"></div>
      </section>
    </div>
  </main>

  <div class="modal-backdrop hidden" id="pick-project-modal">
    <div class="modal">
      <h2 id="pick-project-title">Choose a Project</h2>
      <div class="field"><select id="pick-project-select"></select></div>
      <div class="actions">
        <button id="pick-cancel-btn">Cancel</button>
        <button class="primary" id="pick-go-btn">Continue</button>
      </div>
    </div>
  </div>

  <script src="js/dialogs.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/signed-copy.js"></script>
  <script src="js/task-editor.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/announcements.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
