<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Schedule · ScaffoldPro</title>
  <!-- Tasks are on the Schedule page now (List view); old links still land there. -->
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      let to = 'calendar.html?view=list';
      if (q.get('task')) to += `&task=${encodeURIComponent(q.get('task'))}`;
      location.replace(to);
    })();
  </script>
</head>
<body></body>
</html>
