<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Calendar — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .cal-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .cal-bar h2 { margin: 0 8px 0 4px; min-width: 170px; }
    .cal-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .cal-filter { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; user-select: none; }
    .cal-filter input { margin: 0; }
    .cal-filter.off { opacity: 0.5; }
    .cal-week-start { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
    .cal-week-start select { --control-h: 28px; font-size: 12px; }
    .cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--border); gap: 1px; }
    .cal-head { background: var(--header-bg); font-size: 11px; font-weight: 600; color: var(--text-secondary); padding: 6px 8px; text-align: left; }
    .cal-day { background: var(--panel); min-height: 104px; padding: 4px 5px 6px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cal-day.other { background: color-mix(in srgb, var(--panel) 55%, var(--bg)); }
    .cal-day.other .cal-num { color: var(--text-tertiary); }
    .cal-day.today .cal-num { background: var(--accent); color: #fff; }
    .cal-day.selected { box-shadow: inset 0 0 0 2px var(--accent); }
    .cal-num { font-size: 12px; font-weight: 600; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; margin-bottom: 2px; }
    .cal-ev { font-size: 11px; line-height: 1.35; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: color-mix(in srgb, var(--k) 12%, transparent); color: color-mix(in srgb, var(--k) 60%, var(--text)); border-left: 2px solid color-mix(in srgb, var(--k) 70%, transparent); }
    .cal-ev.done { opacity: 0.55; text-decoration: line-through; }
    .cal-ev.overdue { background: var(--danger-soft); color: var(--danger); border-left-color: var(--danger); }
    .cal-more { font-size: 11px; color: var(--text-tertiary); padding-left: 5px; }
    .cal-side { position: sticky; top: 12px; }
    .cal-side .panel { margin-bottom: 12px; }
    .ev-item { display: block; padding: 7px 8px; border-radius: 6px; color: var(--text); text-decoration: none; border-left: 3px solid color-mix(in srgb, var(--k) 70%, transparent); margin-bottom: 6px; background: color-mix(in srgb, var(--k) 6%, transparent); }
    .ev-item:hover { text-decoration: none; background: color-mix(in srgb, var(--k) 11%, transparent); }
    .ev-item .ev-kind { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); }
    .ev-item .ev-title { font-size: 13px; font-weight: 500; }
    .ev-item.done .ev-title { text-decoration: line-through; color: var(--text-tertiary); }
    .ev-item.overdue { border-left-color: var(--danger); }
    .ev-item .sub { font-size: 12px; }
    .ev-day { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin: 10px 0 4px; }
    /* Week: days across, hours down; things without a time in the all-day row. */
    .week { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--panel); }
    .week-head, .week-allday, .week-hours { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); }
    .week-head, .week-allday { border-bottom: 1px solid var(--border); }
    .week-top { position: sticky; top: 0; z-index: 4; background: var(--panel); }
    .week-head > div { padding: 6px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; font-size: 12px; color: var(--text-secondary); border-left: 1px solid var(--hairline); }
    .week-head > div:first-child, .week-allday > div:first-child { border-left: none; }
    .week-head .wd-num { font-size: 18px; font-weight: 600; color: var(--text); margin-left: 4px; }
    .week-head .today .wd-num { color: #fff; background: var(--accent); border-radius: 50%; display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center; font-size: 15px; }
    .week-allday > div { border-left: 1px solid var(--hairline); padding: 4px; display: flex; flex-direction: column; gap: 2px; min-height: 34px; max-height: 120px; overflow-y: auto; }
    .week-allday .gutter { font-size: 10px; color: var(--text-tertiary); justify-content: center; align-items: center; text-align: center; }
    .week-body { position: relative; height: calc(100vh - 230px); min-height: 420px; overflow-y: auto; }
    .week-hours { position: relative; }
    .week-gutter .hour-label { height: 48px; box-sizing: border-box; line-height: 12px; font-size: 10px; color: var(--text-tertiary); text-align: right; padding-right: 6px; transform: translateY(-6px); }
    .week-col { position: relative; border-left: 1px solid var(--hairline); }
    .week-col .slot { height: 48px; box-sizing: border-box; border-top: 1px solid var(--hairline); cursor: cell; }
    .week-col .slot:first-child { border-top: none; }
    .week-col .slot:hover { background: var(--row-hover); }
    .week-col.today { background: color-mix(in srgb, var(--accent) 3%, transparent); }
    .week-ev { position: absolute; left: 3px; right: 3px; min-height: 22px; border-radius: 5px; padding: 2px 6px; font-size: 11px; line-height: 1.3; overflow: hidden; cursor: pointer;
      background: color-mix(in srgb, var(--k) 16%, var(--panel)); color: color-mix(in srgb, var(--k) 60%, var(--text)); border-left: 3px solid color-mix(in srgb, var(--k) 75%, transparent); text-decoration: none; display: block; }
    .week-ev:hover { text-decoration: none; filter: brightness(0.98); }
    .week-ev .t { font-weight: 600; }
    .week-ev.done { opacity: 0.55; }
    .now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--danger); z-index: 2; pointer-events: none; }
    .now-line::before { content: ''; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    @media (max-width: 1100px) { .cal-layout { grid-template-columns: 1fr; } .cal-side { position: static; } }
  </style>
</head>
<body data-page="calendar">
  <nav id="sidebar"></nav>
  <main id="content">
    <h1>Calendar</h1>
    <div class="subtitle">Deliveries, scaffold inspections, tasks, quotations running out, payments due, lead follow-ups and certificates expiring — all in one place. Click an empty hour in the week to add a task then.</div>

    <div class="cal-bar">
      <button id="cal-prev" data-no-icon title="Previous">‹</button>
      <button id="cal-today" data-no-icon>Today</button>
      <button id="cal-next" data-no-icon title="Next">›</button>
      <h2 id="cal-title"></h2>
      <div class="segmented" id="cal-view">
        <button data-view="week" class="active" data-no-icon>Week</button>
        <button data-view="month" data-no-icon>Month</button>
      </div>
      <label class="cal-week-start" title="Which day the week view starts on">Week starts
        <select id="cal-week-start">
          <option value="yesterday">Yesterday (today 2nd)</option>
          <option value="today">Today</option>
          <option value="monday">Monday</option>
          <option value="sunday">Sunday</option>
        </select></label>
      <div class="cal-filters" id="cal-filters"></div>
    </div>

    <div class="cal-layout">
      <div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="week hidden" id="cal-week"></div>
      </div>
      <div class="cal-side">
        <section class="panel">
          <h3 class="panel-title" id="day-title">Today</h3>
          <div id="day-events"></div>
        </section>
        <section class="panel">
          <h3 class="panel-title">Next 14 Days</h3>
          <div id="agenda"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/dialogs.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/task-editor.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
