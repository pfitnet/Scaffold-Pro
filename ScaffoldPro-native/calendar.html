<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Schedule · ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/tasks.css" />
</head>
<body data-page="calendar">
  <nav id="sidebar"></nav>
  <main id="content" class="cal-page">
    <!-- Calendar: everything dated in ScaffoldPro by week (hours down) or
         month, with a mini month, the chosen day and what's coming up
         beside it (js/calendar.js). -->
    <header class="cal-hero">
      <div class="cal-hero-text">
        <h1>Schedule</h1>
        <div class="cal-eyebrow hidden" id="cal-eyebrow"></div>
        <div class="cal-summary" id="cal-summary" aria-live="polite"></div>
      </div>
      <div class="cal-hero-actions">
        <button class="primary cal-new" id="cal-add" data-no-icon title="New task (N)"><i data-icon="plus" data-size="13"></i><span>New Task</span></button>
        <button class="cal-new-event" id="cal-add-event" data-no-icon title="New event (E)"><i data-icon="calendar" data-size="13"></i><span>New Event</span></button>
      </div>
    </header>


    <div class="cal-toolbar">
      <!-- First, so it stays put whichever view is chosen. -->
      <div class="segmented" id="cal-view" role="tablist" aria-label="View">
        <button data-view="list" data-no-icon title="List (L)">List</button>
        <button data-view="week" class="active" data-no-icon title="Week (W)">Week</button>
        <button data-view="month" data-no-icon title="Month (M)">Month</button>
        <button data-view="time" data-no-icon title="Time log (G)">Time</button>
      </div>
      <div class="cn-nav">
        <button id="cal-prev" class="cal-round" data-no-icon title="Previous" aria-label="Previous"><i data-icon="caret-left" data-size="14"></i></button>
        <button id="cal-today" class="cn-today" data-no-icon title="Go to today (T)">Today</button>
        <button id="cal-next" class="cal-round" data-no-icon title="Next" aria-label="Next"><i data-icon="caret-right" data-size="14"></i></button>
      </div>
      <h2 class="cal-period" id="cal-title"></h2>
      <h2 class="cal-period tl-day" id="tl-day" title="Logged this day"></h2>
      <label class="cal-week-start" title="Which day the week view starts on">
        <i data-icon="calendar" data-size="13"></i>
        <select id="cal-week-start" aria-label="Week starts">
          <option value="yesterday">From yesterday</option>
          <option value="today">From today</option>
          <option value="monday">From Monday</option>
          <option value="sunday">From Sunday</option>
        </select>
      </label>
    </div>

    <!-- List: the tasks, grouped by when they're due (js/tasks.js) -->
    <section class="sch-list hidden" id="sch-list">
      <div class="tk-layout">
      <div class="tk-main">
        <div class="tk-controls">
          <div class="tk-seg" id="task-tabs" role="tablist">
            <span class="tk-seg-pill" aria-hidden="true"></span>
            <button data-view="mine" class="active" role="tab">My Tasks <span class="tk-count" data-count="mine"></span></button>
            <button data-view="team" role="tab">Everyone’s <span class="tk-count" data-count="team"></span></button>
            <button data-view="done" role="tab">Done <span class="tk-count" data-count="done"></span></button>
          </div>
          <div class="tk-filters">
            <label class="tk-search"><i data-icon="search" data-size="15"></i>
              <input type="text" id="task-search" placeholder="Search" /><kbd class="tk-kbd">/</kbd></label>
            <select id="task-person"><option value="">Everyone</option></select>
            <select id="task-project"><option value="">All projects</option></select>
          </div>
        </div>
        <div id="task-list" class="tk-list"></div>
        <!-- At the bottom, as in a chat: stays in view while the list scrolls. -->
        <div class="tk-quick" id="tk-quick">
          <span class="tk-quick-plus" aria-hidden="true"><i data-icon="plus" data-size="18"></i></span>
          <input type="text" id="tk-quick-input" autocomplete="off" spellcheck="false"
            placeholder="Add a task, try “Send revised BOQ to Mr. Law tomorrow 3pm @Tom #26212 !high”" aria-label="Add a task" />
          <div class="tk-quick-chips" id="tk-quick-chips"></div>
          <button type="button" class="tk-quick-more" id="new-task-btn" data-no-icon title="Open the full form">More…</button>
          <kbd class="tk-kbd" title="Press N to add a task">N</kbd>
        </div>
      </div>

      <aside class="tk-side">
        <section class="tk-hero tk-today" id="tk-hero">
      <div class="tk-hero-glow" aria-hidden="true"></div>
      <div class="tk-hero-text">
        <div class="tk-date" id="tk-date"></div>
        <div class="tk-greeting" id="tk-greeting">Today</div>
        <p class="tk-summary" id="tk-summary">What the team needs to do, for a project or not, who it’s for, and when.</p>
        <div class="tk-stats" id="tk-stats"></div>
      </div>
      <div class="tk-ring" id="tk-ring" title="Today: done of due">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="tk-ring-track" cx="60" cy="60" r="50" />
          <circle class="tk-ring-fill" id="tk-ring-fill" cx="60" cy="60" r="50" />
        </svg>
        <div class="tk-ring-label"><b id="tk-ring-pct">0%</b><span id="tk-ring-sub">today</span></div>
      </div>
    </section>
        <section class="tk-panel">
          <h3>This week</h3>
          <div class="tk-week" id="tk-week"></div>
        </section>
        <section class="tk-panel">
          <h3>Team load</h3>
          <div class="tk-team" id="tk-team"></div>
        </section>
      </aside>
    </div>
    </section>

    <!-- Time: a chain of "just finished" entries, each timed from the one
         before (js/time-log.js) -->
    <section class="sch-time hidden" id="sch-time">
      <div class="tk-layout">
        <div class="tk-main">
          <ol class="tl-list" id="tl-list"></ol>
          <div class="tk-quick tl-bar">
            <span class="tk-quick-plus" aria-hidden="true"><i data-icon="clock" data-size="17"></i></span>
            <input type="text" id="tl-input" autocomplete="off" placeholder="What did you just finish? Press Return" aria-label="What you just finished" />
            <select id="tl-task" aria-label="For a task" title="For a task"><option value="">No task</option></select>
            <span class="tl-since" id="tl-since" title="What Return will record"></span>
          </div>
        </div>
        <aside class="tk-side">
          <section class="tk-panel">
            <h3>By task</h3>
            <div id="tl-by-task"></div>
          </section>
          <section class="tk-panel">
            <h3>This week <span class="tl-week-total" id="tl-week-total"></span></h3>
            <div class="tl-week" id="tl-week"></div>
          </section>
        </aside>
      </div>
    </section>

    <div class="cal-layout">
      <div class="cal-main" id="cal-main">
        <!-- Which kinds show: here rather than in the toolbar, so the toolbar is one row in every view. -->
        <div class="cal-filters" id="cal-filters" role="group" aria-label="Show"></div>
        <div class="cal-month hidden" id="cal-grid"></div>
        <div class="week hidden" id="cal-week"></div>
        <div class="cal-keys">
          <span><kbd>←</kbd><kbd>→</kbd> day</span><span><kbd>↑</kbd><kbd>↓</kbd> week</span><span><kbd>T</kbd> today</span><span><kbd>W</kbd><kbd>M</kbd> view</span><span><kbd>N</kbd> new task</span><span><kbd>E</kbd> new event</span><span>Drag down an empty column to schedule an event</span>
        </div>
      </div>
      <aside class="cal-side">
        <section class="panel cal-mini" id="cal-mini"></section>
        <section class="panel cal-dayp">
          <div class="cal-dayp-head">
            <div class="cal-dayp-num" id="day-num"></div>
            <div class="cal-dayp-text"><div class="cal-dayp-title" id="day-title">Today</div><div class="cal-dayp-sub" id="day-sub"></div></div>
            <button class="cal-round cal-dayp-add" id="day-add" data-no-icon title="Add a task on this day" aria-label="Add a task on this day"><i data-icon="plus" data-size="13"></i></button>
          </div>
          <div id="day-events"></div>
        </section>
        <section class="panel">
          <h3 class="panel-title">Up Next <span class="cal-count" id="agenda-count"></span></h3>
          <div id="agenda"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/task-editor.js"></script>
  <script src="js/time-log.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
