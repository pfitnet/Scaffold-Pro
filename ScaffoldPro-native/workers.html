<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Workers · ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/workers.css" />
</head>
<body data-page="workers">
  <nav id="sidebar"></nav>
  <main id="content" class="wk-content">
    <!-- The crew at a glance -->
    <header class="page-header wk-head">
      <div>
        <h1>Workers</h1>
        <p class="subtitle wk-summary" id="wk-summary">The people on site, their employment agreements and their certificates.</p>
      </div>
      <div class="page-actions">
        <label class="wk-search">
          <span class="wk-search-ico" aria-hidden="true"></span>
          <input type="search" id="wk-search" placeholder="Search name, ID, number…" autocomplete="off" spellcheck="false" />
          <kbd>/</kbd>
        </label>
        <button type="button" class="primary wk-new" id="wk-new" data-no-icon title="New worker (⌘N)"><span class="wk-new-ico" aria-hidden="true"></span>New Worker</button>
      </div>
    </header>

    <div class="wk-stats" id="wk-stats" role="group" aria-label="Show only"></div>

    <div class="wk-layout">
      <aside class="wk-roster" aria-label="Workers">
        <div class="wk-roster-head">
          <span id="wk-roster-title">Everyone</span>
          <label class="check-chip wk-archived"><input type="checkbox" id="wk-show-archived" />Archived</label>
        </div>
        <div class="wk-list" id="wk-list" role="listbox" tabindex="0" aria-label="Workers"></div>
      </aside>
      <section class="wk-profile" id="wk-profile" aria-live="polite"></section>
    </div>
  </main>

  <!-- A new worker -->
  <div class="modal-backdrop wk-sheet-backdrop hidden" id="wk-sheet">
    <div class="wk-sheet" role="dialog" aria-modal="true" aria-labelledby="wk-sheet-title">
      <div class="wk-sheet-main">
        <div class="wk-sheet-head">
          <span class="wk-avatar xl" id="ns-avatar">?</span>
          <div>
            <h2 id="wk-sheet-title">New Worker</h2>
            <p>Their employment agreement is made from these details, ready to print and sign.</p>
          </div>
        </div>
        <div class="wk-form">
          <label class="wk-f span-2"><span>Name</span><input type="text" id="ns-name" placeholder="As on their ID card, e.g. Chan Tai Man" autocomplete="off" /></label>
          <label class="wk-f"><span>Chinese name</span><input type="text" id="ns-chineseName" placeholder="e.g. 陳大文" autocomplete="off" /></label>
          <div class="wk-f"><span>On the agreement</span>
            <div class="wk-seg" id="ns-honorific" role="radiogroup"><button type="button" data-v="先生" class="on" data-no-icon>先生 Mr</button><button type="button" data-v="女士" data-no-icon>女士 Ms</button></div></div>
          <label class="wk-f"><span>ID card no.</span><input type="text" id="ns-idNumber" placeholder="A123456(7)" autocomplete="off" spellcheck="false" /><em class="wk-hint" id="ns-id-hint"></em></label>
          <label class="wk-f"><span>Daily wage</span><span class="wk-money"><i>HK$</i><input type="number" id="ns-dailyWage" min="0" step="10" placeholder="1300" /><i>/ day</i></span></label>
          <label class="wk-f"><span>Position</span><input type="text" id="ns-position" list="wk-positions" placeholder="Scaffolder" /></label>
          <label class="wk-f"><span>Starts</span><input type="date" id="ns-startDate" /></label>
          <label class="wk-f"><span>Phone</span><input type="tel" id="ns-phone" placeholder="Optional" /></label>
          <label class="wk-f"><span>Email</span><input type="email" id="ns-email" placeholder="Optional" /></label>
        </div>
        <div class="wk-sheet-error hidden" id="ns-error"></div>
      </div>
      <aside class="wk-sheet-side">
        <div class="wk-mini-paper" id="ns-paper"></div>
        <div class="wk-sheet-actions">
          <button type="button" id="ns-cancel" data-no-icon>Cancel</button>
          <button type="button" class="primary" id="ns-save" data-no-icon>Create Worker</button>
        </div>
      </aside>
    </div>
  </div>

  <datalist id="wk-positions">
    <option value="Scaffolder"></option><option value="Foreman"></option><option value="General Worker"></option>
    <option value="Rigger"></option><option value="Driver"></option><option value="Safety Supervisor"></option>
  </datalist>

  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/docx-export.js"></script>
  <script src="js/doc-preview.js"></script>
  <script src="js/workers.js"></script>
</body>
</html>
