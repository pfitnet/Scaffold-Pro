<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Letter · ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/letter-editor.css" />
</head>
<body data-page="project-detail">
  <nav id="sidebar"></nav>
  <main id="content">
    <div id="letter-header"></div>

    <div id="not-found" class="empty-state hidden"><h2>Letter not found</h2></div>

    <div id="letter-page" class="hidden">
      <div class="toolbar" style="justify-content: space-between;">
        <div style="display:flex; gap:8px; align-items:center;">
          <label style="font-size:12px; color:var(--text-secondary);" for="status-select">Status</label>
          <select id="status-select">
            <option value="Draft">Draft</option>
            <option value="Issued">Issued</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <button type="button" class="export-menu" id="export-btn" data-no-icon>Export</button>
          <button id="export-pdf-btn" class="hidden" tabindex="-1">Export PDF</button>
          <button id="export-word-btn" class="hidden" tabindex="-1">Export Word</button>
          <button id="print-btn">Print…</button>
          <button id="delete-btn" class="danger-btn">Delete…</button>
          <span class="save-state" id="save-state"></span>
        </div>
        <a id="back-link" class="hidden" href="letters.html" aria-hidden="true"></a>
      </div>

      <div class="letter-fields">
        <div class="field"><label>Our Ref. (letter number)</label><div class="our-ref" id="our-ref"></div></div>
        <div class="field"><label for="f-date">Date</label><input type="date" id="f-date" /></div>
        <div class="field"><label for="f-yourRef">Your Ref.</label><input type="text" id="f-yourRef" /></div>
        <div class="field"><label>Project</label><div class="our-ref" id="f-project"></div></div>
        <div class="field wide"><label for="f-recipientName">To</label><input type="text" id="f-recipientName" placeholder="Company or person" /></div>
        <div class="field wide"><label for="f-client">Fill in from a client</label><select id="f-client"></select></div>
        <div class="field wide"><label for="f-recipientAddress">Address (one line each)</label><textarea id="f-recipientAddress" rows="3"></textarea></div>
        <div class="field wide"><label for="f-attention">Attn.</label><input type="text" id="f-attention" placeholder="e.g. Mr. Chan" />
          <label for="f-subject" style="margin-top:6px;">Re: (subject)</label><input type="text" id="f-subject" /></div>
      </div>

      <div id="rt-toolbar"></div>

      <div class="paper-wrap">
        <div class="paper" id="paper">
          <div class="paper-head" id="paper-head"></div>
          <div class="paper-body">
            <div class="opening" id="opening" title="Printed from the details above"></div>
            <div class="opening-hint">↑ From the details above. Write the letter below.</div>
            <div id="letter-body" contenteditable="true" spellcheck="true"></div>
          </div>
          <div class="paper-foot" id="paper-foot"></div>
        </div>
      </div>

      <!-- Annexures: each one's cover page and files follow the letter (js/letter-attachments.js). -->
      <section class="annex-panel" id="annex-panel">
        <div class="annex-head">
          <div><h2>Attachments</h2><p class="small-note">Each is listed under the letter and gets its own cover page (the letterhead, who it's to, and its name) followed by its files, after the letter's pages.</p></div>
          <label class="annex-prefix" title="How the annexures are numbered">Numbered <input type="text" id="annex-prefix" value="ANNEXURE P." /><span>01, 02…</span></label>
        </div>
        <div id="annex-list"></div>
        <button type="button" class="annex-add" id="annex-add" data-no-icon>+ Add Attachment…</button>
      </section>
    </div>
  </main>

  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/docx-export.js"></script>
  <script src="js/doc-preview.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/hover-menu.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/doc-authors.js"></script>
  <script src="js/rich-editor.js"></script>
  <script src="js/letter-editor.js"></script>
  <script src="js/letter-attachments.js"></script>
</body>
</html>
