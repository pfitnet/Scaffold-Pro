<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Quotation — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .boq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .qty-input { width: 60px; padding: 3px 6px; }
    .price-input { width: 80px; padding: 3px 6px; }
    .ref-price { font-size: 11px; color: var(--text-secondary); display: block; }
    .override { color: var(--accent); font-weight: 600; }
    .totals-box { margin-top: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .totals-box .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
    .totals-box .row.grand { font-size: 18px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; }
    .header-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .header-fields .field { display: flex; flex-direction: column; gap: 4px; }
    .header-fields .field.full { grid-column: 1 / -1; }
    .letter-fields { grid-template-columns: repeat(4, 1fr); padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .header-fields label { font-size: 11px; color: var(--text-secondary); }
    .picker-results { max-height: 320px; overflow-y: auto; }
    .boq-reference {
      display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
    }
    .boq-reference label { font-size: 12px; color: var(--text-secondary); }
    .boq-reference-note { font-size: 12px; color: var(--text-secondary); margin-left: 4px; }
    .hire-control { display: flex; align-items: center; gap: 8px; }
    .hire-control input[type="number"] { width: 60px; }
    .inline-check { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); }
    .line-discount-note { display: block; font-size: 11px; color: var(--text-secondary); }
    .markup-price { display: block; font-size: 11px; color: var(--accent); }
    .key-terms-actions { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .extra-section { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
    .extra-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .extra-head .controls { display: flex; gap: 4px; }
    .extra-head .extra-kind { display: inline-flex; align-items: center; gap: 6px; }
    .extra-head .controls button { padding: 2px 8px; font-size: 12px; }
    .extra-title-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .extra-title-row .block-title { flex: 1; font-weight: 600; }
    .extra-title-row .block-prefix { width: 44px; }
    .extra-section table input { width: 100%; padding: 3px 6px; box-sizing: border-box; }
    .extra-section table .narrow { width: 64px; }
    .extra-section .rate-only { color: var(--text-secondary); font-style: italic; text-align: center; white-space: nowrap; }
    .extra-add-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
    .extra-add-row .add-desc { flex: 1; min-width: 160px; }
    .extra-add-row .add-unit, .extra-add-row .add-qty { width: 64px; }
    .extra-add-row .add-price { width: 110px; }
    .extra-section .block-note { width: 100%; margin-top: 8px; font-style: italic; box-sizing: border-box; }
  </style>
</head>
<body data-page="project-detail">
  <nav id="sidebar"></nav>
  <main id="content">
    <div id="quotation-header"></div>

    <div id="not-found" class="empty-state hidden">
      <h2>Quotation not found</h2>
    </div>

    <div id="quotation-body" class="hidden">
      <div class="toolbar" style="justify-content: space-between;">
        <div style="display:flex; gap:8px; align-items:center;">
          <label style="font-size:12px; color:var(--text-secondary);">Status</label>
          <select id="status-select">
            <option value="Draft">Draft</option>
            <option value="Issued">Issued</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <label style="font-size:12px; color:var(--text-secondary);" for="language-select">Items in</label>
          <select id="language-select" title="The language the item names are printed in on the PDF and Word copy"></select>
          <button id="export-pdf-btn">Export PDF</button>
          <button id="export-word-btn" title="A Word copy laid out like the PDF, saved next to it">Export Word</button>
          <button id="print-btn">Print…</button>
          <button id="locate-file-btn" title="Show this document’s PDF or Word file in Finder">Locate File</button>
          <button id="delete-doc-btn" class="danger-btn">Delete…</button>
        </div>
        <a id="back-link" href="#">&larr; Back to project</a>
      </div>

      <div class="signed-bar hidden" id="signed-bar"></div>

      <div class="boq-reference">
        <label for="boq-reference-select">Reference BOQ</label>
        <select id="boq-reference-select"></select>
        <button id="import-boq-btn">Import Items</button>
        <span class="boq-reference-note" id="boq-reference-note"></span>
      </div>

      <!-- The standard quotation's letter fields (as on Qt26193) -->
      <div class="header-fields letter-fields">
        <div class="field full"><label>Re: (subject line)</label><input type="text" id="q-subject" placeholder="e.g. 1601 Scaffolding Materials - Rental - GL-28 G/F South G-015 For BS Wone - Req. by Gomez" /></div>
        <div class="field"><label>Your Ref. No.</label><input type="text" id="q-clientRef" /></div>
        <div class="field"><label>Site Ref.</label><input type="text" id="q-siteRef" placeholder="e.g. MTR 1601" /></div>
        <div class="field"><label>Sent</label><input type="text" id="q-deliveryMethod" placeholder="BY EMAIL ONLY" /></div>
        <div class="field" id="q-hire-field"><label>Minimum Hire</label>
          <div class="hire-control">
            <label class="inline-check"><input type="checkbox" id="q-minimumHireEnabled" /> Apply</label>
            <input type="number" id="q-minimumHireMonths" min="1" step="1" title="Months" /> <span class="small-note">months</span>
          </div>
        </div>
        <div class="field" id="q-min-monthly-field"><label>Minimum Monthly Rental Charge</label>
          <label class="inline-check" title="The monthly rental charge is at least this amount (Settings › Quotations)"><input type="checkbox" id="q-minimumMonthlyChargeEnabled" /> <span id="q-min-monthly-label">Apply (HK$ 1,000.00)</span></label>
        </div>
      </div>

      <div class="header-fields">
        <div class="field"><label>Date</label><input type="date" id="doc-date-input" /></div>
        <div class="field"><label>Pricing</label>
          <select id="pricing-mode-select">
            <option value="Sale">Sale</option>
            <option value="Rental">Rental</option>
          </select>
        </div>
        <div class="field"><label>Valid Until</label><input type="date" id="valid-until-input" /></div>
        <div class="field"><label for="adjustment-input">Markup / Discount</label><input type="text" id="adjustment-input" placeholder="e.g. +30%, -15% or -1000" title="+30% marks every item up 30% (unit prices rounded to 0.1, up or off as set in Settings); -15% takes 15% off; -1000 takes 1,000 off. Leave blank for none." /><span class="small-note hidden" id="client-markup-hint"></span></div>
        <!-- No sales tax in Hong Kong: shown only on an older document that still has a tax rate, so it can be set to 0. -->
        <div class="field hidden" id="tax-rate-field"><label>Tax Rate (%) — set to 0</label><input type="number" id="tax-rate-input" min="0" step="0.01" /></div>
        <div class="field full"><label for="key-terms-input">Key Terms</label>
          <div class="key-terms-actions">
            <button type="button" id="key-terms-standard-btn">Start from Standard Terms</button>
            <span class="small-note">Printed in the Terms and Conditions. Leave blank to use the standard key terms from Settings.</span>
          </div>
          <textarea id="key-terms-input" rows="7" placeholder="Blank: the standard key terms from Settings are printed (shown below).&#10;e.g. (i) Payment : First two month's rental is to be paid upon order confirmation."></textarea>
        </div>
      </div>

      <div class="boq-grid">
        <div>
          <h2>Add Materials</h2>
          <div class="toolbar">
            <select id="source-select">
              <option value="SP">SP Material &amp; Price List 2026</option>
              <option value="SCAFOM">SCAFOM Material &amp; Price List</option>
            </select>
          </div>
          <div class="toolbar">
            <input type="text" id="search-box" placeholder="Search items" />
            <select id="category-select"><option value="">All Categories</option></select>
          </div>
          <div class="picker-results" id="picker-results"></div>
        </div>

        <div>
          <h2>Line Items</h2>
          <div id="line-items"></div>
          <details class="custom-item" id="custom-item-box">
            <summary>+ Add a custom item (not on a price list)</summary>
            <div class="custom-item-row">
              <input type="text" id="ci-description" placeholder="Description, e.g. Transport to site" />
              <input type="text" id="ci-unit" value="lot" title="Unit" />
              <input type="number" id="ci-qty" min="1" step="1" value="1" title="Quantity" />
              <input type="number" id="ci-extra" min="0" step="0.01" placeholder="Unit price" />
              <button id="ci-add-btn">Add</button>
            </div>
          </details>

          <!-- Extra sections, as on the company's quotations: priced rows
               (design fees, erection prices), rates-only rows, notes. -->
          <div id="extra-sections"></div>
          <div class="line-quick-add">
            <button id="add-delivery-btn">+ Delivery Charge</button>
            <button id="add-priced-btn" title="A titled section of priced rows added to the total, e.g. Design Fees or Erection &amp; Dismantle">+ Priced Section</button>
            <button id="add-rates-btn" title="A titled section of rates shown after the total as “(Rate Only)”, e.g. manpower rates">+ Rates Section</button>
            <button id="add-standard-rates-btn" title="Erection &amp; Dismantle Manpower Rates with the standard rates for Scaffolder CP, Scaffolder, Rigger and General Helper (Settings › Standard Quotation)">+ Standard Manpower Rates</button>
            <button id="add-note-btn" title="A note across the table, after the total">+ Note</button>
          </div>
          <div class="totals-box" id="totals-box"></div>

          <div style="margin-top: 20px;">
            <label style="font-size:12px; color:var(--text-secondary);">Notes</label>
            <textarea id="notes-box" rows="3"></textarea>
          </div>

          <!-- Drawings this document is based on (PDF, DWG, DXF, images) -->
          <div class="linked-drawings-panel">
            <div class="section-toolbar"><h2>Drawings</h2><button id="upload-linked-drawing-btn" title="PDF, DWG, DXF or images — you can choose several at once">Upload Drawings…</button></div>
            <div id="linked-drawings"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/sidebar.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/qty-tab.js"></script>
  <script src="js/keep-focus.js"></script>
  <script src="js/item-picker.js"></script>
  <script src="js/doc-language.js"></script>
  <script src="js/document-actions.js"></script>
  <script src="js/signed-copy.js"></script>
  <script src="js/line-discount.js"></script>
  <script src="js/drag-reorder.js"></script>
  <script src="js/file-drop.js"></script>
  <script src="js/linked-drawings.js"></script>
  <script src="js/paragraph-format.js"></script>
  <script src="js/docx-export.js"></script>
  <script src="js/quotation-editor.js"></script>
</body>
</html>
