<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bill of Quantities — ScaffoldPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .boq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .qty-input, .price-input { width: 70px; padding: 3px 6px; }
    .ref-price { font-size: 11px; color: var(--text-secondary); display: block; }
    .override { color: var(--accent); font-weight: 600; }
    .section-header td { background: #f0f2f6; font-weight: 600; font-size: 12px; color: var(--text-secondary); }
    .grand-total { font-size: 20px; font-weight: 700; text-align: right; margin-top: 12px; }
    .picker-results { max-height: 360px; overflow-y: auto; }
    .boq-rates { margin-top: 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
    .boq-rates h3 { margin: 0 0 6px; font-size: 14px; }
    .boq-rates table input { width: 100%; box-sizing: border-box; padding: 3px 6px; }
    .boq-rates .narrow { width: 70px; }
    .boq-rates .actions-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .boq-rates textarea { width: 100%; box-sizing: border-box; margin-top: 8px; }
</style>
</head>
<body data-page="project-detail">
  <nav id="sidebar"></nav>
  <main id="content">
    <div id="boq-header"></div>

    <div id="not-found" class="empty-state hidden">
      <h2>BOQ not found</h2>
    </div>

    <div id="boq-body" class="hidden">
      <div class="toolbar" style="justify-content: space-between;">
        <div style="display:flex; gap:8px; align-items:center;">
          <label style="font-size:12px; color:var(--text-secondary);">Status</label>
          <select id="status-select">
            <option value="Draft">Draft</option>
            <option value="Issued">Issued</option>
          </select>
          <label style="font-size:12px; color:var(--text-secondary);" for="orientation-select">Page</label>
          <select id="orientation-select" title="How the BQ sheet is printed">
            <option value="Landscape">Landscape — with prices</option>
            <option value="Portrait">Portrait — letterhead, no prices</option>
          </select>
          <button id="export-pdf-btn">Export PDF</button>
          <button id="export-word-btn" title="A Word copy laid out like the PDF, saved next to it">Export Word</button>
          <button id="print-btn">Print…</button>
          <button id="locate-file-btn" title="Show this document’s PDF or Word file in Finder">Locate File</button>
          <button id="delete-doc-btn" class="danger-btn">Delete…</button>
        </div>
        <a id="back-link" href="#">&larr; Back to project</a>
      </div>

      <!-- BOQ settings, as in the company's BQ sheet -->
      <div class="details-bar">
        <div class="field"><label>Pricing</label>
          <select id="boq-mode-select"><option value="Rental">Rental</option><option value="Sale">Sale</option></select>
        </div>
        <div class="field"><label>Mark up / down (%)</label>
          <input type="number" id="boq-markup-input" step="0.5" title="e.g. 10 for +10%, -5 for −5%" />
        </div>
        <div class="field grow"><label>Structure</label>
          <input type="text" id="boq-structure-input" placeholder="e.g. Access platform for louvre installation" />
        </div>
      </div>
      <p class="small-note hidden" id="boq-markup-note"></p>
      <p class="small-note hidden" id="boq-client-markup"></p>

      <div class="boq-grid">
        <div>
          <h2>Add Materials</h2>
          <div class="toolbar">
            <select id="source-select">
              <option value="SP">SP Material &amp; Price List 2026</option>
              <option value="SCAFOM">SCAFOM Material &amp; Price List</option>
            </select>
          </div>
          <div class="toolbar">
            <input type="text" id="search-box" placeholder="Search items" />
            <select id="category-select"><option value="">All Categories</option></select>
          </div>
          <div class="picker-results" id="picker-results"></div>
        </div>

        <div>
          <h2>Line Items</h2>
          <div id="line-items"></div>
          <details class="custom-item" id="custom-item-box">
            <summary>+ Add a custom item (not on a price list)</summary>
            <div class="custom-item-row">
              <input type="text" id="ci-description" placeholder="Description, e.g. Transport to site" />
              <input type="text" id="ci-unit" value="lot" title="Unit" />
              <input type="number" id="ci-qty" min="1" step="1" value="1" title="Quantity" />
              <input type="number" id="ci-extra" min="0" step="0.01" placeholder="Weight per unit (kg)" />
              <button id="ci-add-btn">Add</button>
            </div>
          </details>
          <div class="grand-total" id="grand-total"></div>

          <!-- Amounts added after the subtotal, then rates, on the landscape BQ sheet -->
          <div class="boq-rates" id="boq-charges"></div>
          <div class="boq-rates" id="boq-rates"></div>

          <div style="margin-top: 20px;">
            <label style="font-size:12px; color:var(--text-secondary);">Notes</label>
            <textarea id="notes-box" rows="3"></textarea>
          </div>

          <!-- Drawings this document is based on (PDF, DWG, DXF, images) -->
          <div class="linked-drawings-panel">
            <div class="section-toolbar"><h2>Drawings</h2><button id="upload-linked-drawing-btn" title="PDF, DWG, DXF or images — you can choose several at once">Upload Drawings…</button></div>
            <div id="linked-drawings"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/sidebar.js"></script>
  <script src="js/qty-tab.js"></script>
  <script src="js/document-actions.js"></script>
  <script src="js/line-discount.js"></script>
  <script src="js/drag-reorder.js"></script>
  <script src="js/linked-drawings.js"></script>
  <script src="js/docx-export.js"></script>
  <script src="js/boq-editor.js"></script>
</body>
</html>
